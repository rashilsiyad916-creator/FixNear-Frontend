<div class="search-bar" [class.compact]="compact" [class.focused]="focused">

  <!-- Service selector -->
  <div class="sb-field sb-service">
    <div class="sb-label">
      <svg class="sb-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>
      </svg>
      <span>Service</span>
    </div>
    <app-fancy-select
      [options]="serviceOptions"
      [model]="service"
      (modelChange)="service = $event"
      placeholder="All services"
      accent="violet"
      [bare]="true">
    </app-fancy-select>
  </div>

  <span class="sb-divider" aria-hidden="true"></span>

  <!-- Location input -->
  <div class="sb-field sb-location">
    <div class="sb-label">
      <svg class="sb-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span>Location</span>
    </div>
    <div class="sb-input-wrap">
      <input type="text"
             [(ngModel)]="location"
             [placeholder]="placeholder"
             (focus)="focused = true"
             (blur)="focused = false"
             (keyup.enter)="onSearch()"
             autocomplete="off" />
      <button type="button" class="sb-clear"
              *ngIf="location"
              (click)="onClear()"
              aria-label="Clear location">
        ✕
      </button>
    </div>
  </div>

  <!-- Search button -->
  <button class="sb-btn" (click)="onSearch()" [disabled]="loading">
    <svg *ngIf="!loading" width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <span class="sb-spinner" *ngIf="loading"></span>
    <span class="sb-btn-text">Search</span>
  </button>
</div>
